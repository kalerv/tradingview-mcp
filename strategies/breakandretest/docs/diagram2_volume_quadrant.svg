<svg viewBox="0 0 900 680" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="680" fill="#ffffff"/>

  <text x="450" y="32" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Volume Quadrant Matrix — Resolving Retest Outcome</text>
  <text x="450" y="54" font-size="12.5" fill="#6b7280" text-anchor="middle">Poke-through volume (rows) × Reclaim within window (columns)</text>

  <!-- Column headers -->
  <text x="320" y="92" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="middle">RECLAIMS LEVEL</text>
  <text x="320" y="108" font-size="11.5" fill="#6b7280" text-anchor="middle">(price closes back beyond level, same/next bar)</text>
  <text x="660" y="92" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="middle">NO RECLAIM</text>
  <text x="660" y="108" font-size="11.5" fill="#6b7280" text-anchor="middle">(price stays through the level)</text>

  <!-- Row headers -->
  <text x="70" y="220" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="middle">LOW</text>
  <text x="70" y="236" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="middle">VOLUME</text>
  <text x="70" y="252" font-size="11" fill="#6b7280" text-anchor="middle">poke</text>

  <text x="70" y="470" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="middle">HIGH</text>
  <text x="70" y="486" font-size="13.5" font-weight="bold" fill="#374151" text-anchor="middle">VOLUME</text>
  <text x="70" y="502" font-size="11" fill="#6b7280" text-anchor="middle">poke</text>

  <!-- Cell: Low + Reclaim = PASS -->
  <rect x="140" y="130" width="360" height="180" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="166" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">PASS</text>
  <text x="320" y="188" font-size="12" fill="#14532d" text-anchor="middle">Healthy retest — no real pressure</text>
  <text x="320" y="206" font-size="12" fill="#14532d" text-anchor="middle">broke the level, strength reclaimed it</text>
  <text x="320" y="230" font-size="12" fill="#14532d" text-anchor="middle">→ Continuation, same direction</text>
  <text x="320" y="250" font-size="12" fill="#14532d" text-anchor="middle">as the original breakout</text>
  <text x="320" y="278" font-size="11" fill="#166534" text-anchor="middle" font-style="italic">Standard reclaim volume threshold applies</text>
  <text x="320" y="295" font-size="11" fill="#166534" text-anchor="middle" font-style="italic">(configurable multiplier, e.g. 1.5x–2.5x)</text>

  <!-- Cell: Low + No Reclaim = FAIL -->
  <rect x="520" y="130" width="360" height="180" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="700" y="166" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">FAIL</text>
  <text x="700" y="188" font-size="12" fill="#7f1d1d" text-anchor="middle">Drift through with no conviction</text>
  <text x="700" y="206" font-size="12" fill="#7f1d1d" text-anchor="middle">in either direction — weak signal</text>
  <text x="700" y="230" font-size="12" fill="#7f1d1d" text-anchor="middle">→ Fade, opposite direction</text>
  <text x="700" y="250" font-size="12" fill="#7f1d1d" text-anchor="middle">of the original breakout</text>
  <text x="700" y="278" font-size="11" fill="#991b1b" text-anchor="middle" font-style="italic">Lowest-conviction fail case —</text>
  <text x="700" y="295" font-size="11" fill="#991b1b" text-anchor="middle" font-style="italic">treat as the weakest of the two FAIL cells</text>

  <!-- Cell: High + Reclaim = CONDITIONAL -->
  <rect x="140" y="380" width="360" height="180" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="320" y="416" font-size="16" font-weight="bold" fill="#9a3412" text-anchor="middle">CONDITIONAL</text>
  <text x="320" y="438" font-size="12" fill="#9a3412" text-anchor="middle">Real pressure tested the level —</text>
  <text x="320" y="456" font-size="12" fill="#9a3412" text-anchor="middle">defaults to FAIL unless overridden</text>
  <text x="320" y="480" font-size="12" font-weight="bold" fill="#9a3412" text-anchor="middle">Reclaim must clear a HIGHER bar</text>
  <text x="320" y="500" font-size="12" fill="#9a3412" text-anchor="middle">than the standard reclaim threshold</text>
  <text x="320" y="528" font-size="11" fill="#7c2d12" text-anchor="middle" font-style="italic">Override threshold strictly &gt; poke RVOL</text>
  <text x="320" y="545" font-size="11" fill="#7c2d12" text-anchor="middle" font-style="italic">(configurable, e.g. 2.0x–3.5x)</text>

  <!-- Cell: High + No Reclaim = FAIL strong -->
  <rect x="520" y="380" width="360" height="180" rx="10" fill="#fecaca" stroke="#991b1b" stroke-width="2.5"/>
  <text x="700" y="416" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">FAIL (high conviction)</text>
  <text x="700" y="438" font-size="12" fill="#7f1d1d" text-anchor="middle">Real selling/buying pressure —</text>
  <text x="700" y="456" font-size="12" fill="#7f1d1d" text-anchor="middle">level is genuinely giving way</text>
  <text x="700" y="480" font-size="12" font-weight="bold" fill="#7f1d1d" text-anchor="middle">→ Strongest fade signal</text>
  <text x="700" y="500" font-size="12" fill="#7f1d1d" text-anchor="middle">in the entire matrix</text>
  <text x="700" y="528" font-size="11" fill="#7f1d1d" text-anchor="middle" font-style="italic">Highest-conviction of all four cells</text>

  <!-- legend -->
  <text x="450" y="635" font-size="11.5" fill="#6b7280" text-anchor="middle">Volume basis: time-of-day RVOL (external) AND/OR pullback-relative RVOL (internal) — both checked per Open Item §3</text>
</svg>
