<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="720" fill="#ffffff"/>

  <text x="490" y="30" font-size="17" font-weight="bold" fill="#111827" text-anchor="middle">Worked Example — Long Setup (PDH Level = 201.00)</text>
  <text x="490" y="50" font-size="12" fill="#6b7280" text-anchor="middle">Illustrative numbers only — not historical data. Mirror logic applies to short setups off PDL.</text>

  <!-- price axis -->
  <line x1="150" y1="60" x2="150" y2="660" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- TP line: 203.80 @ y=116 -->
  <line x1="150" y1="116" x2="620" y2="116" stroke="#16a34a" stroke-width="2" stroke-dasharray="7,4"/>
  <circle cx="150" cy="116" r="4" fill="#16a34a"/>
  <text x="635" y="112" font-size="12.5" font-weight="bold" fill="#15803d">TP = 203.80</text>
  <text x="635" y="128" font-size="11" fill="#15803d">Entry + 2R (fixed 2R, v1)</text>

  <!-- breakout close context line: 202.10 @ y=252 -->
  <line x1="150" y1="252" x2="620" y2="252" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>
  <circle cx="150" cy="252" r="3.5" fill="#2563eb"/>
  <text x="635" y="248" font-size="12" fill="#1d4ed8">Breakout candle close = 202.10</text>
  <text x="635" y="263" font-size="11" fill="#1d4ed8" opacity="0.85">(context — confirms the break, not the entry)</text>

  <!-- Entry line: 201.10 @ y=332 -->
  <line x1="150" y1="332" x2="620" y2="332" stroke="#111827" stroke-width="2.5"/>
  <circle cx="150" cy="332" r="4.5" fill="#111827"/>
  <text x="635" y="328" font-size="13" font-weight="bold" fill="#111827">ENTRY ≈ 201.10</text>
  <text x="635" y="344" font-size="11" fill="#374151">After retest reclaims the level (PASS outcome)</text>

  <!-- PDH level line: 201.00 @ y=340 -->
  <line x1="150" y1="340" x2="620" y2="340" stroke="#6b7280" stroke-width="2"/>
  <text x="635" y="368" font-size="12.5" fill="#4b5563">PDH Level = 201.00</text>

  <!-- Structural SL line: 199.75 @ y=440 -->
  <line x1="150" y1="440" x2="620" y2="440" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="150" cy="440" r="4.5" fill="#dc2626"/>
  <text x="635" y="436" font-size="13" font-weight="bold" fill="#b91c1c">SL = 199.75</text>
  <text x="635" y="452" font-size="11" fill="#7f1d1d">Close of the structural swing-low candle that</text>
  <text x="635" y="466" font-size="11" fill="#7f1d1d">originated the breakout leg (close-confirmed exit)</text>

  <!-- Circuit breaker: 198.08 @ y=574 -->
  <line x1="150" y1="574" x2="620" y2="574" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5,4"/>
  <circle cx="150" cy="574" r="4" fill="#b91c1c"/>
  <text x="635" y="570" font-size="12.5" font-weight="bold" fill="#7f1d1d">Circuit breaker ≈ 198.08</text>
  <text x="635" y="586" font-size="11" fill="#7f1d1d">Entry × (1 − 1.5%, configurable) — hard backstop,</text>
  <text x="635" y="600" font-size="11" fill="#7f1d1d">checked intrabar (not candle-close)</text>

  <!-- R brackets on far side -->
  <line x1="100" y1="332" x2="100" y2="440" stroke="#374151" stroke-width="1.5"/>
  <line x1="93" y1="332" x2="107" y2="332" stroke="#374151" stroke-width="1.5"/>
  <line x1="93" y1="440" x2="107" y2="440" stroke="#374151" stroke-width="1.5"/>
  <text x="60" y="390" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle" transform="rotate(-90 60 390)">1R = 1.35</text>

  <line x1="65" y1="116" x2="65" y2="332" stroke="#374151" stroke-width="1.5"/>
  <line x1="58" y1="116" x2="72" y2="116" stroke="#374151" stroke-width="1.5"/>
  <line x1="58" y1="332" x2="72" y2="332" stroke="#374151" stroke-width="1.5"/>
  <text x="25" y="224" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle" transform="rotate(-90 25 224)">2R = 2.70 (TP)</text>

  <text x="490" y="685" font-size="11.5" fill="#6b7280" text-anchor="middle">Short setups off PDL mirror this exactly: SL = close of the swing-high candle that originated the breakdown leg, TP = Entry − 2R.</text>
</svg>
