<svg viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="800" fill="#ffffff"/>
  <text x="450" y="-9999" font-size="1"> </text>

  <!-- Title -->
  <text x="450" y="-9999"></text>

  <!-- Session gate banner -->
  <rect x="20" y="8" width="860" height="38" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="450" y="32" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">SESSION GATE — applies throughout: only valid 9:30–11:30 AM ET</text>

  <!-- Stage A -->
  <rect x="170" y="70" width="560" height="56" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="450" y="102" font-size="14" font-weight="bold" fill="#374151" text-anchor="middle">Mark Previous Day High (PDH) &amp; Previous Day Low (PDL)</text>

  <line x1="450" y1="126" x2="450" y2="158" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage B -->
  <rect x="170" y="160" width="560" height="86" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="186" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">BREAKOUT CONFIRMED</text>
  <text x="450" y="208" font-size="12.5" fill="#1e3a8a" text-anchor="middle">5m candle closes beyond level  •  body ≥ 50% of candle range</text>
  <text x="450" y="226" font-size="12.5" fill="#1e3a8a" text-anchor="middle">close ≥ 1 × ATR beyond level (ATR mode configurable — distance-from-level vs candle range)</text>

  <line x1="450" y1="246" x2="450" y2="278" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage C -->
  <rect x="170" y="280" width="560" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="450" y="307" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle">RETEST WINDOW OPENS</text>
  <text x="450" y="328" font-size="12.5" fill="#1e3a8a" text-anchor="middle">Timeout: 7 bars @1m  ·  3 bars @3m  ·  2 bars @5m (configurable timeframe)</text>
  <text x="450" y="346" font-size="12.5" fill="#1e3a8a" text-anchor="middle">Only the FIRST retest within the window counts</text>

  <line x1="450" y1="358" x2="450" y2="390" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage D -->
  <rect x="170" y="392" width="560" height="78" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="450" y="419" font-size="15" font-weight="bold" fill="#9a3412" text-anchor="middle">PRICE POKES THROUGH THE LEVEL</text>
  <text x="450" y="441" font-size="12.5" fill="#9a3412" text-anchor="middle">Volume quadrant (poke volume × reclaim) resolves the outcome</text>
  <text x="450" y="458" font-size="12.5" fill="#9a3412" text-anchor="middle">→ see Diagram 2: Volume Quadrant Matrix</text>

  <!-- split arrows -->
  <line x1="450" y1="470" x2="450" y2="486" stroke="#374151" stroke-width="2"/>
  <line x1="450" y1="486" x2="230" y2="510" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="486" x2="670" y2="510" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage E1 PASS -->
  <rect x="40" y="512" width="380" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="230" y="542" font-size="16" font-weight="bold" fill="#14532d" text-anchor="middle">PASS</text>
  <text x="230" y="564" font-size="12.5" fill="#14532d" text-anchor="middle">Continuation — trade SAME</text>
  <text x="230" y="580" font-size="12.5" fill="#14532d" text-anchor="middle">direction as the original breakout</text>

  <!-- Stage E2 FAIL -->
  <rect x="480" y="512" width="380" height="78" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="670" y="542" font-size="16" font-weight="bold" fill="#7f1d1d" text-anchor="middle">FAIL</text>
  <text x="670" y="564" font-size="12.5" fill="#7f1d1d" text-anchor="middle">Fade — trade OPPOSITE</text>
  <text x="670" y="580" font-size="12.5" fill="#7f1d1d" text-anchor="middle">direction (reversal of the breakout)</text>

  <!-- merge arrows -->
  <line x1="230" y1="590" x2="230" y2="608" stroke="#374151" stroke-width="2"/>
  <line x1="670" y1="590" x2="670" y2="608" stroke="#374151" stroke-width="2"/>
  <line x1="230" y1="608" x2="450" y2="630" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="608" x2="450" y2="630" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage F -->
  <rect x="170" y="632" width="560" height="128" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="450" y="660" font-size="15" font-weight="bold" fill="#4c1d95" text-anchor="middle">ENTRY &amp; RISK MANAGEMENT</text>
  <text x="450" y="684" font-size="12.5" fill="#4c1d95" text-anchor="middle">SL — close beyond the structural swing point that originated the breakout leg</text>
  <text x="450" y="703" font-size="12.5" fill="#4c1d95" text-anchor="middle">(close-confirmed, not a wick touch)</text>
  <text x="450" y="724" font-size="12.5" fill="#4c1d95" text-anchor="middle">Circuit breaker — configurable % from entry, checked intrabar (hard backstop)</text>
  <text x="450" y="745" font-size="12.5" fill="#4c1d95" text-anchor="middle">TP — fixed 2R minimum (v1; scaling to next key level deferred)</text>
</svg>
